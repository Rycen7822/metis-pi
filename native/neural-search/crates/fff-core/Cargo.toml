[package]
name = "fff-search"
version = "0.11.0"
edition = "2024"
license = "MIT"
authors = ["Dmitriy Kovalenko <dmtr.kovalenko@outlook.com>"]
description = "Metis Rust file/content search, ranking and live indexing"

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
# Count full rescans and their causes. Always on in debug builds; enable this
# to retain the same diagnostic counters in release profiling builds.
rescan-stats = []

[dependencies]
ahash = { workspace = true }
rayon = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
fff-query-parser = { workspace = true }
blake3 = { workspace = true }
dirs = { workspace = true }
libc = "0.2"
git2 = { workspace = true }
glidesort = { workspace = true }
fff-grep = { workspace = true }
aho-corasick = "1"
memchr = "2"
heed = { workspace = true }
neo_frizbee = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
parking_lot = { workspace = true }
pathdiff = { workspace = true }
regex = { workspace = true }
regex-syntax = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
zlob = { workspace = true }

[dev-dependencies]
ctor = "0.2"
proptest = { version = "1", default-features = false, features = ["std", "fork"] }
rand = { version = "0.8", features = ["small_rng"] }
tempfile = "3.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

