name: appearance-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --no-save @earendil-works/pi-coding-agent@0.87.0 @earendil-works/pi-tui@0.87.0
      - run: npm run verify
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -y -qq tmux
      - run: npm run test:pty:strict
