name: appearance-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r test/subagents/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -y -qq tmux
      - run: npm run test:pty:strict
        env:
          PI_BIN: ${{ github.workspace }}/node_modules/.bin/pi
