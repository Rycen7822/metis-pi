name: appearance-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  admission:
    name: Check duplicate feature push
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.pr.outputs.run }}
    steps:
      - id: pr
        name: Keep full validation unless a matching PR can run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const repo = process.env.GITHUB_REPOSITORY;
          const branch = process.env.GITHUB_REF_NAME;
          const sha = process.env.GITHUB_SHA;
          const matches = pr => pr.state === 'open' && pr.head?.repo?.full_name === repo
            && pr.head?.ref === branch && pr.head?.sha === sha;
          async function request(path, query = {}) {
            const url = new URL(`${process.env.GITHUB_API_URL}/repos/${repo}/${path}`);
            url.search = new URLSearchParams(query).toString();
            const response = await fetch(url, {
              headers: {
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
              },
              signal: AbortSignal.timeout(5000),
            });
            if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);
            return response.json();
          }
          let duplicate = false;
          try {
            const pulls = await request('pulls', { state: 'open', head: `${repo.split('/')[0]}:${branch}`, per_page: '100' });
            const candidate = pulls.find(matches);
            if (candidate) {
              let pr = await request(`pulls/${candidate.number}`);
              if (matches(pr) && pr.mergeable === null) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                pr = await request(`pulls/${candidate.number}`);
              }
              duplicate = matches(pr) && pr.mergeable === true;
            }
          } catch {
            console.log('::warning::PR lookup unavailable; keeping full push validation.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `run=${!duplicate}\n`);
          console.log(duplicate ? 'Matching mergeable PR covers this push; skipping duplicate tests.' : 'Full push validation required.');
          NODE
  test:
    name: Pi 1.3.0
    needs: admission
    if: ${{ always() && !cancelled() && needs.admission.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r test/subagents/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: .work/tsc
          key: ${{ runner.os }}-node22-tsc-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'src/pi-*/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-tsc-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'src/pi-*/tsconfig.json') }}-
      - name: Verify selected host packages
        env:
          EXPECTED_PI_VERSION: '1.3.0'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          for (const name of ['pi-agent-core', 'pi-ai', 'pi-coding-agent', 'pi-tui', 'pi-mcp']) {
            const manifest = JSON.parse(readFileSync(`node_modules/@earendil-works/${name}/package.json`, 'utf8'));
            assert.equal(manifest.version, process.env.EXPECTED_PI_VERSION, name);
          }
          NODE
      - run: npm run verify:neural-engine
      - run: npm run verify
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/metis-pi-node-compile-cache
      - name: Ensure tmux is available
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tmux
          fi
          tmux -V
      - run: npm run test:pty:strict
        env:
          PI_BIN: ${{ github.workspace }}/node_modules/.bin/pi
  neural-engine:
    name: Owned Rust search · Linux x64
    needs: admission
    if: ${{ always() && !cancelled() && needs.admission.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'
          components: rust-docs
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/neural-search -> ../../.work/neural-engine/target
          cache-all-crates: true
          cache-targets: true
      - run: cargo install cargo-zigbuild --locked --version 0.23.4
      - run: npm run verify:neural-engine
      - run: npm run build:neural-engine
        id: rebuild
      - name: Require the rebuilt payload to match the checkout
        run: git diff --exit-code -- assets/neural-search
      - name: Run inherited Rust unit checks
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.work/neural-engine/target
          TMPDIR: ${{ github.workspace }}/.work/neural-engine/tmp
        run: |
          mkdir -p "$TMPDIR"
          cargo test --manifest-path native/neural-search/Cargo.toml --workspace --lib --locked
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.rebuild.outcome == 'success' }}
        with:
          name: neural-search-linux-x64
          path: assets/neural-search/
  retire-feature-push:
    name: Retire duplicate feature push
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # Only trusted default-branch code receives actions:write; never PR code.
      - uses: actions/checkout@v4
        id: trusted
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Keep PR validation and retire only a confirmed duplicate branch push
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_CI_REF: ${{ steps.trusted.outputs.commit }}
        run: node scripts/ci/cancel-duplicate-push.mjs
