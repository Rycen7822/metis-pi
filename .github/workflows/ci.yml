name: appearance-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  admission:
    name: Check duplicate feature push
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.pr.outputs.run }}
    steps:
      - id: pr
        name: Keep full validation unless a matching PR can run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const repo = process.env.GITHUB_REPOSITORY;
          const branch = process.env.GITHUB_REF_NAME;
          const sha = process.env.GITHUB_SHA;
          const matches = pr => pr.state === 'open' && pr.head?.repo?.full_name === repo
            && pr.head?.ref === branch && pr.head?.sha === sha;
          async function request(path, query = {}) {
            const url = new URL(`${process.env.GITHUB_API_URL}/repos/${repo}/${path}`);
            url.search = new URLSearchParams(query).toString();
            const response = await fetch(url, {
              headers: {
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
              },
              signal: AbortSignal.timeout(5000),
            });
            if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);
            return response.json();
          }
          let duplicate = false;
          try {
            const pulls = await request('pulls', { state: 'open', head: `${repo.split('/')[0]}:${branch}`, per_page: '100' });
            const candidate = pulls.find(matches);
            if (candidate) {
              let pr = await request(`pulls/${candidate.number}`);
              if (matches(pr) && pr.mergeable === null) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                pr = await request(`pulls/${candidate.number}`);
              }
              duplicate = matches(pr) && pr.mergeable === true;
            }
          } catch {
            console.log('::warning::PR lookup unavailable; keeping full push validation.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `run=${!duplicate}\n`);
          console.log(duplicate ? 'Matching mergeable PR covers this push; skipping duplicate tests.' : 'Full push validation required.');
          NODE
  validation:
    name: Pi SDK validation · ${{ matrix.os }} · ${{ matrix.lane.name }}
    needs: admission
    if: ${{ always() && !cancelled() && needs.admission.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        lane:
          - { name: Checks }
          - { name: Root 1, suite: all, shard: '1/2' }
          - { name: Root 2, suite: all, shard: '2/2' }
          - { name: Web 1, suite: web-access, shard: '1/2' }
          - { name: Web 2, suite: web-access, shard: '2/2' }
          - { name: Python }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NODE_COMPILE_CACHE: ${{ github.workspace }}/.work/node-compile-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: matrix.lane.name == 'Root 1'
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        if: matrix.lane.name == 'Python'
      - run: uv pip install --system --python python -r test/subagents/requirements.txt
        if: matrix.lane.name == 'Python'
      - run: npm ci --ignore-scripts --bin-links=false --no-audit --no-fund
      - name: Prepare the shipped SDK without changing a managed Pi installation
        run: npm run prepare:pi-sdk
      - run: npm run prepare:subagents
      - run: npm run build:plugins
        if: matrix.lane.name != 'Python'
      - name: Cache TypeScript build info
        if: matrix.lane.name == 'Checks'
        uses: actions/cache@v4
        with:
          path: .work/tsc
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-tsc7-${{ hashFiles('package-lock.json', 'src/pi-sdk/distribution.json',
            'tsconfig.json', 'config/typescript/*.json', 'src/pi-*/tsconfig.json') }}-${{ github.sha }}
          restore-keys: >-
            ${{ runner.os }}-${{ runner.arch }}-tsc7-${{ hashFiles('package-lock.json', 'src/pi-sdk/distribution.json',
            'tsconfig.json', 'config/typescript/*.json', 'src/pi-*/tsconfig.json') }}-
      - name: Verify selected host packages
        if: matrix.lane.name == 'Checks'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { sdkRuntimePackages, sdkVersion } from './src/pi-sdk/artifact.mjs';
          for (const name of sdkRuntimePackages) {
            const manifest = JSON.parse(readFileSync(`node_modules/@earendil-works/pi-${name}/package.json`, 'utf8'));
            assert.equal(manifest.version, sdkVersion, name);
          }
          NODE
      - name: Check types, lint, and native assets
        if: matrix.lane.name == 'Checks'
        run: >-
          npm run lint:tests && npm run lint:comments && npm run lint:types &&
          npm run verify:native-assets && npm run check && npm run check:test
      - name: Require rebuilt Web Access bundles to match the checkout
        if: runner.os == 'Linux' && matrix.lane.name == 'Web 1'
        run: |
          changes=$(git status --porcelain -- src/pi-web-access/dist)
          if [[ -n "$changes" ]]; then printf '%s\n' "$changes"; exit 1; fi
      - name: Run ${{ matrix.lane.name }} tests
        if: matrix.lane.shard
        run: node scripts/test.mjs ${{ matrix.lane.suite }} --test-shard=${{ matrix.lane.shard }}
      - run: npm run test:subagents
        if: matrix.lane.name == 'Python'
      - name: Exercise the managed subagent SDK with an offline provider
        if: matrix.lane.name == 'Python'
        env:
          SUBAGENT_PI_LIVE_PI: '1'
        run: >-
          node scripts/python.mjs -m pytest -q test/subagents/test_transport.py
          -k "sdk_default_and_reader_complete_tool_roundtrip or sdk_stop_releases_write_directory"
          -o cache_dir=.work/test-cache/subagents-sdk
      - name: Ensure tmux is available
        if: runner.os == 'Linux' && matrix.lane.name == 'Checks'
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tmux
          fi
          tmux -V
      - run: npm run test:pty:strict
        if: runner.os == 'Linux' && matrix.lane.name == 'Checks'
        env:
          PI_BIN: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js
  test:
    name: Pi SDK · ${{ matrix.os }}
    needs: [admission, validation]
    if: ${{ always() && !cancelled() && needs.admission.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all validation lanes to pass
        env:
          VALIDATION: ${{ needs.validation.result }}
        run: test "$VALIDATION" = success
  neural-engine:
    name: Owned Rust search · Linux x64
    needs: admission
    if: ${{ always() && !cancelled() && needs.admission.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'
          components: rust-docs
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/neural-search/engine -> ../../../.work/neural-engine/target
          cache-all-crates: true
          cache-targets: true
      - run: cargo install cargo-zigbuild --locked --version 0.23.4
      - run: npm run verify:neural-engine
      - run: npm run build:neural-engine
        id: rebuild
      - name: Require the rebuilt payload to match the checkout
        run: git diff --exit-code -- src/neural-search/assets
      - name: Run inherited Rust unit checks
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.work/neural-engine/target
          TMPDIR: ${{ github.workspace }}/.work/neural-engine/tmp
        run: |
          mkdir -p "$TMPDIR"
          cargo test --manifest-path src/neural-search/engine/Cargo.toml --workspace --lib --locked
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.rebuild.outcome == 'success' }}
        with:
          name: neural-search-linux-x64
          path: src/neural-search/assets/
  retire-feature-push:
    name: Retire duplicate feature push
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # Only trusted default-branch code receives actions:write; never PR code.
      - uses: actions/checkout@v4
        id: trusted
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Keep PR validation and retire only a confirmed duplicate branch push
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_CI_REF: ${{ steps.trusted.outputs.commit }}
        run: node scripts/ci/cancel-duplicate-push.mjs
