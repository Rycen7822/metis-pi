[workspace]
members = [
  "crates/fff-c",
  "crates/fff-core",
  "crates/fff-query-parser",
  "crates/fff-grep",
]

resolver = "2"

[workspace.lints.clippy]
module_inception = "allow"

[workspace.dependencies]
fff-grep = { version = "0.11.0", path = "crates/fff-grep" }
fff-query-parser = { version = "0.11.0", path = "crates/fff-query-parser" }

# Shared dependencies
ahash = "0.8"
blake3 = "1.8.2"
dirs = "5.0"
# Git operations stay local; do not pull network TLS/SSH backends.
git2 = { version = "0.21.0", default-features = false, features = [
  "vendored-libgit2",
] }
# Cross-platform file identity; already in the graph via the debouncer.
file-id = "0.2.3"
glidesort = "0.1"
heed = "0.22.0"
zlob = { version = "=1.6.5" }

neo_frizbee = { version = "0.13.3", features = ["match_end_col"] }
notify = { version = "9.0.0-rc.3" }
notify-debouncer-full = { package = "fff-notify-debouncer-full", version = "0.9.4" }
parking_lot = "0.12"
pathdiff = "0.2.1"
rayon = "1.8.0"
regex = "1.11"
regex-syntax = "0.8.10"
smallvec = { version = "1.13", features = ["const_generics", "union"] }
thiserror = "2.0.10"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.ci]
inherits = "release"
# Thin LTO keeps portable publishing builds practical; SIMD is dispatched at runtime.
lto = "thin"

[profile.bench]
inherits = "release"

# Keep release-level optimization and symbols for Linux perf sampling.
[profile.prof]
inherits = "release"
debug = "full"
strip = false
lto = "thin"
