[package]
name = "sgrep"
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Search code and text with ripgrep and local static embeddings."
repository = "https://github.com/mrmps/sgrep"

[dependencies]
memmap2 = "0.9"
crc32fast = "1"
sha2 = "0.11"
tempfile = "3"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
half = "2"
libloading = "=0.9.0"
libc = "0.2"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
regex = "1"
rayon = "1"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
tree-sitter-language-pack = "=1.21.0"
tree-sitter = "=0.27.1"
memchr = "2"
zstd = "=0.14.0"
chonkie = { version = "=0.1.1", default-features = false }

[profile.release]
lto = "thin"
