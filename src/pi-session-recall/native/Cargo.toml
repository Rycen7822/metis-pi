[package]
name = "metis-session-recall"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std"] }
memchr = "2"
metis-bekko = { path = "../../local-embedding/bekko" }
metis-potion = { path = "../../local-embedding/potion" }
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"
usearch = { version = "=2.26.6", default-features = false }
